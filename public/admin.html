<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — NEXT CHAPTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="site-nav">
  <a class="logo-group" href="/">
    <span class="logo">NEXT CHAPTER</span>
    <span class="logo-tag">Private Matching Journey</span>
  </a>
  <div class="nav-right">
    <nav class="nav-links">
      <a href="mypage.html">My Page</a>
      <a href="#" id="logout-link" class="nav-auth">Logout</a>
    </nav>
  </div>
  <button class="menu-btn" aria-label="Menu">☰</button>
</header>

<div class="page-header">
  <div class="eyebrow">Admin</div>
  <h1 class="display" id="admin-title">Applications</h1>
</div>

<main class="section tight" style="padding-top:0">
  <div class="mypage-tabs" id="admin-section-tabs">
    <button type="button" data-section="applications" class="active">신청 관리</button>
    <button type="button" data-section="journeys">여행 · 일정 관리</button>
    <button type="button" data-section="members">회원 관리</button>
    <button type="button" data-section="matching">매칭 관리</button>
    <button type="button" data-section="revenue">매출 관리</button>
    <button type="button" data-section="permissions" id="permissions-tab-btn" style="display:none">권한 설정</button>
  </div>

  <div id="panel-applications" class="mypage-panel active">
    <div class="admin-tabs" id="status-tabs">
      <button data-status="" class="active">All</button>
      <button data-status="pending">Pending</button>
      <button data-status="approved">Approved</button>
      <button data-status="rejected">Rejected</button>
    </div>
    <div id="admin-content">
      <div class="empty-state">불러오는 중…</div>
    </div>
  </div>

  <div id="panel-journeys" class="mypage-panel">
    <button type="button" id="journey-new-btn" class="btn-outline" style="margin-bottom:20px">+ 새 여행 추가</button>
    <div id="journey-form-wrap"></div>
    <div id="journeys-content">
      <div class="empty-state">불러오는 중…</div>
    </div>
    <div id="itinerary-editor"></div>
  </div>

  <div id="panel-members" class="mypage-panel">
    <div class="admin-tabs" id="member-status-tabs">
      <button data-verification="" class="active">All</button>
      <button data-verification="pending">Pending</button>
      <button data-verification="verified">Verified</button>
      <button data-verification="rejected">Rejected</button>
    </div>
    <input type="text" id="member-search" placeholder="이름 · 아이디 · 연락처 검색" style="margin:16px 0;max-width:320px;width:100%;padding:10px 12px;border:1px solid var(--line);font:inherit;font-size:13px">
    <div id="members-content">
      <div class="empty-state">불러오는 중…</div>
    </div>
  </div>

  <div id="panel-matching" class="mypage-panel">
    <div class="field" style="max-width:360px">
      <label>여행 선택</label>
      <select id="matching-journey-select"><option value="">불러오는 중…</option></select>
    </div>
    <div id="matching-content"></div>
  </div>

  <div id="panel-revenue" class="mypage-panel">
    <div style="display:flex;gap:14px;flex-wrap:wrap;max-width:720px">
      <div class="field" style="flex:1;min-width:200px">
        <label>이름 · 전화번호 검색</label>
        <input type="text" id="revenue-search" placeholder="이름 또는 전화번호">
      </div>
      <div class="field" style="min-width:150px">
        <label>결제일 (부터)</label>
        <input type="date" id="revenue-from">
      </div>
      <div class="field" style="min-width:150px">
        <label>결제일 (까지)</label>
        <input type="date" id="revenue-to">
      </div>
    </div>
    <div id="revenue-content">
      <div class="empty-state">불러오는 중…</div>
    </div>
  </div>

  <div id="panel-permissions" class="mypage-panel">
    <p style="color:var(--muted);font-size:13px;margin-bottom:20px">여기서 만든 계정만 어드민에 로그인할 수 있습니다. 일반 회원가입으로는 관리자 권한이 생기지 않습니다.</p>
    <button type="button" id="permission-new-btn" class="btn-outline" style="margin-bottom:20px">+ 관리자 계정 추가</button>
    <div id="permission-form-wrap"></div>
    <div id="permissions-content">
      <div class="empty-state">불러오는 중…</div>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
