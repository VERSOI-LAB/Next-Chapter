<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Page — NEXT CHAPTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="site-nav">
  <a class="logo-group" href="/">
    <span class="logo">NEXT CHAPTER</span>
    <span class="logo-tag">Private Matching Journey</span>
  </a>
  <div class="nav-right">
    <nav class="nav-links">
      <a href="journeys.html">Journeys</a>
      <a href="story.html">Story</a>
      <a href="#" id="logout-link" class="nav-auth">Logout</a>
    </nav>
  </div>
  <button class="menu-btn" aria-label="Menu">☰</button>
</header>

<div class="page-header">
  <div class="eyebrow">Member</div>
  <h1 class="display">My Page</h1>
</div>

<main>
  <div class="mypage-tabs" style="margin:0 6vw 34px">
    <button type="button" data-tab="account" class="active">계정</button>
    <button type="button" data-tab="profile">내 프로필</button>
    <button type="button" data-tab="verification">신원검증</button>
  </div>

  <div id="panel-account" class="mypage-panel active">
    <div class="mypage-grid">
      <div class="profile-card">
        <h2>Profile</h2>
        <form id="profile-form">
          <div class="field">
            <label>이메일</label>
            <input type="email" id="p-email" disabled>
          </div>
          <div class="field">
            <label>검증 상태</label>
            <div id="p-verification"><span class="badge pending">확인 중</span></div>
          </div>
          <div class="field">
            <label for="p-full-name">이름</label>
            <input type="text" id="p-full-name" name="full_name">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="p-gender">성별</label>
              <select id="p-gender" name="gender">
                <option value="">선택</option>
                <option value="male">남성</option>
                <option value="female">여성</option>
              </select>
            </div>
            <div class="field">
              <label for="p-birth-year">출생연도</label>
              <input type="number" id="p-birth-year" name="birth_year" min="1950" max="2010">
            </div>
          </div>
          <div class="field">
            <label for="p-phone">연락처</label>
            <input type="tel" id="p-phone" name="phone">
          </div>
          <div class="field">
            <label for="p-bio">소개</label>
            <textarea id="p-bio" name="bio" placeholder="간단한 자기소개를 남겨주세요"></textarea>
          </div>
          <button type="submit" class="btn">Save changes</button>
          <div class="form-msg" id="profile-msg"></div>
        </form>
      </div>

      <div>
        <p class="section-label">My Applications</p>
        <div class="app-list" id="applications-list">
          <div class="empty-state">불러오는 중…</div>
        </div>
      </div>
    </div>
  </div>

  <div id="panel-profile" class="mypage-panel" style="padding:0 6vw 140px;max-width:640px">
    <p class="section-label">내 프로필 작성</p>
    <p style="font-size:12px;color:var(--muted);margin:-14px 0 26px;line-height:1.6">나의 조건과 가치관을 작성하면 더 정확한 매칭에 활용됩니다.</p>
    <div id="self-profile-container"></div>
    <button type="button" class="btn" id="save-self-profile-btn" style="margin-top:6px">저장하기</button>
    <div class="form-msg" id="self-profile-msg"></div>
  </div>

  <div id="panel-verification" class="mypage-panel" style="padding:0 6vw 140px;max-width:640px">
    <p class="section-label">신원 검증 단계 현황</p>
    <p style="font-size:12px;color:var(--muted);margin:-14px 0 6px;line-height:1.6">서류 인증 심사를 통과하면 항목별로 인증 완료 처리됩니다.</p>
    <table class="status-table" id="verification-table">
      <tr><td>본인확인 (휴대폰) <span class="required-tag">필수</span></td><td id="status-phone"></td></tr>
      <tr><td>혼인관계증명서(상세) <span class="required-tag">필수</span></td><td id="status-marital"></td></tr>
      <tr><td>직업 인증</td><td id="status-job"></td></tr>
      <tr><td>학력 인증</td><td id="status-education"></td></tr>
      <tr><td>소득 인증</td><td id="status-income"></td></tr>
      <tr><td>자산 인증</td><td id="status-asset"></td></tr>
    </table>
    <div id="doc-upload-panel"></div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/profile-data.js"></script>
<script src="js/mypage.js"></script>
<script src="js/mypage-profile.js"></script>
<script src="js/mypage-verification.js"></script>
</body>
</html>
