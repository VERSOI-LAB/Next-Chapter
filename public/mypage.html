<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Page — NEXT CHAPTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="site-nav">
  <a class="logo" href="/">NEXT CHAPTER</a>
  <nav class="nav-links">
    <a href="index.html#journeys">Journeys</a>
    <a href="#" id="logout-link">Logout</a>
  </nav>
  <button class="menu-btn" aria-label="Menu">☰</button>
</header>

<div class="page-header">
  <div class="eyebrow">Member</div>
  <h1 class="display">My Page</h1>
</div>

<main class="mypage-grid">
  <div class="profile-card">
    <h2>Profile</h2>
    <form id="profile-form">
      <div class="field">
        <label>이메일</label>
        <input type="email" id="p-email" disabled>
      </div>
      <div class="field">
        <label>검증 상태</label>
        <div id="p-verification"><span class="badge pending">확인 중</span></div>
      </div>
      <div class="field">
        <label for="p-full-name">이름</label>
        <input type="text" id="p-full-name" name="full_name">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="p-gender">성별</label>
          <select id="p-gender" name="gender">
            <option value="">선택</option>
            <option value="male">남성</option>
            <option value="female">여성</option>
          </select>
        </div>
        <div class="field">
          <label for="p-birth-year">출생연도</label>
          <input type="number" id="p-birth-year" name="birth_year" min="1950" max="2010">
        </div>
      </div>
      <div class="field">
        <label for="p-phone">연락처</label>
        <input type="tel" id="p-phone" name="phone">
      </div>
      <div class="field">
        <label for="p-bio">소개</label>
        <textarea id="p-bio" name="bio" placeholder="간단한 자기소개를 남겨주세요"></textarea>
      </div>
      <button type="submit" class="btn">Save changes</button>
      <div class="form-msg" id="profile-msg"></div>
    </form>
  </div>

  <div>
    <p class="section-label">My Applications</p>
    <div class="app-list" id="applications-list">
      <div class="empty-state">불러오는 중…</div>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/mypage.js"></script>
</body>
</html>
