<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey — NEXT CHAPTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="site-nav">
  <a class="logo-group" href="/">
    <span class="logo">NEXT CHAPTER</span>
    <span class="logo-tag">Private Matching Journey</span>
  </a>
  <div class="nav-right">
    <nav class="nav-links">
      <a href="about.html">About</a>
      <a href="verification.html">Verification</a>
      <a href="journeys.html">Journeys</a>
      <a href="story.html">Story</a>
      <a href="login.html" data-auth-link class="nav-auth">Login</a>
    </nav>
    <a class="nav-cta" href="signup.html">JOIN</a>
  </div>
  <button class="menu-btn" aria-label="Menu">☰</button>
</header>

<main class="journey-detail" id="journey-root">
  <div class="journey-detail-media"><img id="j-image" alt=""></div>
  <div class="journey-detail-body">
    <div class="eyebrow" id="j-meta">Loading…</div>
    <h1 class="display" id="j-title"></h1>
    <p class="lead" id="j-summary"></p>
    <p id="j-description"></p>

    <ul class="journey-meta-list">
      <li><span>일정</span><span id="j-duration">—</span></li>
      <li><span>정원</span><span id="j-capacity">—</span></li>
      <li><span>참가비</span><span id="j-price">—</span></li>
      <li><span>출발 예정일</span><span id="j-start">—</span></li>
    </ul>

    <div class="eyebrow">포함</div>
    <ul id="j-included" style="margin:16px 0 32px;padding-left:20px;font-size:14px;line-height:2;color:var(--ink)"></ul>

    <form id="apply-form">
      <div class="field">
        <label for="message">지원 메시지 (선택)</label>
        <textarea id="message" name="message" placeholder="간단한 자기소개나 신청 사유를 남겨주세요"></textarea>
      </div>

      <div id="passport-fields" style="display:none">
        <p class="lead" style="font-size:14px;margin-bottom:16px">해외 여행은 항공권·숙박권 예약을 위해 여권 정보가 필요합니다.</p>
        <div class="field-row">
          <div class="field">
            <label for="passport-name-kr">이름 (한글)</label>
            <input type="text" id="passport-name-kr" placeholder="홍길동">
          </div>
          <div class="field">
            <label for="passport-name-en">영문이름 (여권 표기)</label>
            <input type="text" id="passport-name-en" placeholder="HONG GILDONG">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="passport-number">여권번호</label>
            <input type="text" id="passport-number" placeholder="M12345678">
          </div>
          <div class="field">
            <label for="passport-expiry">여권만료일</label>
            <input type="date" id="passport-expiry">
          </div>
        </div>
        <div class="field">
          <label for="passport-image">여권 사진면 이미지 업로드</label>
          <input type="file" id="passport-image" accept="image/*,.pdf">
        </div>
      </div>

      <button type="button" class="btn" id="apply-btn">신청하기</button>
      <button type="button" class="btn" id="apply-save-btn" style="display:none">저장하기</button>
      <div class="form-msg" id="apply-msg"></div>
    </form>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/journey.js"></script>
</body>
</html>
