<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — NEXT CHAPTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="site-nav">
  <a class="logo-group" href="/">
    <span class="logo">NEXT CHAPTER</span>
    <span class="logo-tag">Private Matching Journey</span>
  </a>
  <div class="nav-right">
    <nav class="nav-links">
      <a href="about.html">About</a>
      <a href="verification.html">Verification</a>
      <a href="journeys.html">Journeys</a>
      <a href="story.html">Story</a>
      <a href="login.html" class="nav-auth">Login</a>
    </nav>
    <a class="nav-cta" href="signup.html">JOIN</a>
  </div>
  <button class="menu-btn" aria-label="Menu">☰</button>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1>Sign up</h1>
    <div class="sub">검증된 3040을 위한 프라이빗 매칭 저니에 참여하세요</div>

    <form id="signup-form">
      <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" autocomplete="username" minlength="4" maxlength="20" pattern="[a-zA-Z0-9_]{4,20}" placeholder="영문, 숫자, _ 조합 4~20자" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="password_confirm">비밀번호 확인</label>
        <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="full_name">이름</label>
        <input type="text" id="full_name" name="full_name" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="birth_year">출생연도 (연나이 30~39세만 가입 가능)</label>
        <input type="number" id="birth_year" name="birth_year" inputmode="numeric" placeholder="예: 1990" required>
        <div class="form-msg" id="birth-year-msg"></div>
      </div>

      <div class="field">
        <label for="phone">휴대폰번호</label>
        <div style="display:flex;gap:8px">
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="010-0000-0000" style="flex:1" required>
          <button type="button" id="send-code-btn" class="btn btn-outline" style="width:auto;white-space:nowrap">인증번호 받기</button>
        </div>
      </div>
      <div class="field" id="code-field" style="display:none">
        <label for="code">인증번호</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="code" name="code" inputmode="numeric" maxlength="6" placeholder="6자리 숫자" style="flex:1">
          <button type="button" id="verify-code-btn" class="btn btn-outline" style="width:auto;white-space:nowrap">확인</button>
        </div>
        <div class="form-msg" id="phone-msg"></div>
      </div>

      <div class="field">
        <label for="email">이메일주소</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="field" style="border-top:1px solid var(--line);padding-top:20px">
        <label style="display:flex;align-items:flex-start;gap:8px;text-transform:none;font-size:13px;cursor:pointer;margin-bottom:12px">
          <input type="checkbox" id="consent-terms" style="width:auto;margin-top:3px">
          <span>[필수] <a href="terms.html" target="_blank" rel="noopener">NEXT CHAPTER 이용약관</a>에 동의합니다.</span>
        </label>
        <label style="display:flex;align-items:flex-start;gap:8px;text-transform:none;font-size:13px;cursor:pointer;margin-bottom:12px">
          <input type="checkbox" id="consent-privacy-check" style="width:auto;margin-top:3px">
          <span>[필수] <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>을 확인했습니다.</span>
        </label>
        <label style="display:flex;align-items:flex-start;gap:8px;text-transform:none;font-size:13px;cursor:pointer;margin-bottom:12px">
          <input type="checkbox" id="consent-privacy-collect" style="width:auto;margin-top:3px">
          <span>[필수] 개인정보 수집·이용에 동의합니다.</span>
        </label>
        <label style="display:flex;align-items:flex-start;gap:8px;text-transform:none;font-size:13px;cursor:pointer;margin-bottom:12px">
          <input type="checkbox" id="consent-age19" style="width:auto;margin-top:3px">
          <span>[필수] 만 19세 이상이며 입력한 정보가 사실임을 확인합니다.</span>
        </label>
        <label style="display:flex;align-items:flex-start;gap:8px;text-transform:none;font-size:13px;cursor:pointer;margin-bottom:8px">
          <input type="checkbox" id="consent-marketing" style="width:auto;margin-top:3px">
          <span>[선택] 마케팅 정보 수신에 동의합니다.</span>
        </label>
        <div id="marketing-channels" style="display:none;padding-left:26px;flex-wrap:wrap;gap:14px;margin-bottom:8px">
          <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:12px;cursor:pointer"><input type="checkbox" id="consent-sms" style="width:auto"> SMS 수신</label>
          <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:12px;cursor:pointer"><input type="checkbox" id="consent-marketing-email" style="width:auto"> 이메일 수신</label>
          <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:12px;cursor:pointer"><input type="checkbox" id="consent-message" style="width:auto"> 메시지 수신</label>
          <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:12px;cursor:pointer"><input type="checkbox" id="consent-push" style="width:auto"> 앱 푸시 수신</label>
        </div>
        <div class="form-msg" id="consent-msg"></div>
      </div>

      <button type="submit" class="btn">Sign up</button>
      <div class="form-msg" id="form-msg"></div>
    </form>

    <div class="auth-switch">이미 계정이 있으신가요? <a href="login.html">Login</a></div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
