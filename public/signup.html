<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — NEXT CHAPTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="site-nav">
  <a class="logo" href="/">NEXT CHAPTER</a>
  <nav class="nav-links">
    <a href="index.html#journeys">Journeys</a>
    <a href="index.html#how">How it works</a>
    <a href="login.html">Login</a>
  </nav>
  <button class="menu-btn" aria-label="Menu">☰</button>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1>Sign up</h1>
    <div class="sub">검증된 3040을 위한 프라이빗 매칭 저니에 참여하세요</div>

    <form id="signup-form">
      <div class="field">
        <label for="full_name">이름</label>
        <input type="text" id="full_name" name="full_name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="gender">성별</label>
          <select id="gender" name="gender" required>
            <option value="">선택</option>
            <option value="male">남성</option>
            <option value="female">여성</option>
          </select>
        </div>
        <div class="field">
          <label for="birth_year">출생연도</label>
          <input type="number" id="birth_year" name="birth_year" min="1950" max="2010" placeholder="1990">
        </div>
      </div>
      <div class="field">
        <label for="phone">연락처</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="010-0000-0000">
      </div>
      <button type="submit" class="btn">Sign up</button>
      <div class="form-msg" id="form-msg"></div>
    </form>

    <div class="auth-switch">이미 계정이 있으신가요? <a href="login.html">Login</a></div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
